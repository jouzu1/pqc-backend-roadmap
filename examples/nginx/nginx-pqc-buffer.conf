# NGINX Configuration Template for Post-Quantum Cryptography (PQC) & SNAP BI API Gateway
# Solusi mitigasi error HTTP 431 Request Header Fields Too Large akibat ukuran X-SIGNATURE PQC (~4.4 KB)

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # =========================================================================
    # 1. PQC Buffer Tuning (Mitigasi Header Pembengkakan ML-DSA-65 & Composite)
    # =========================================================================
    # Buffer default (1k/4k) tidak cukup untuk header SNAP BI komposit PQC.
    client_header_buffer_size 4k;
    large_client_header_buffers 4 32k;

    # Batas ukuran payload request body transaksi
    client_max_body_size 10m;

    # =========================================================================
    # 2. Pengaturan TLS 1.3 & Hybrid Key Exchange (X25519MLKEM768)
    # Catatan: Membutuhkan OpenSSL 3.2+ dengan oqs-provider aktif
    # =========================================================================
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Logging format dengan metrik ukuran header & SSL negotiation
    log_format pqc_combined '$remote_addr - $remote_user [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            'request_length=$request_length '
                            'ssl_protocol=$ssl_protocol ssl_cipher=$ssl_cipher '
                            'ssl_curves=$ssl_curves';

    access_log /var/log/nginx/access_pqc.log pqc_combined;

    upstream core_banking_backend {
        server 127.0.0.1:8080;
        keepalive 32;
    }

    server {
        listen 4433 ssl;
        server_name api.bank.co.id;

        ssl_certificate     /etc/ssl/certs/snap-pqc.crt;
        ssl_certificate_key /etc/ssl/private/snap-pqc.key;

        location /v1.0/ {
            proxy_pass http://core_banking_backend;

            # Forwarding headers untuk standard SNAP BI
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Buffer proxy forwarding untuk upstream backend
            proxy_buffer_size 32k;
            proxy_buffers 4 32k;
            proxy_busy_buffers_size 64k;

            # Timeout budget
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
            proxy_send_timeout 10s;
        }
    }
}
